<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Debug Dashboard</title>
  <style>
    body { font-family: Arial; margin: 0; background: #000; color: #0f0; }
    #app { max-width: 1200px; margin: 0 auto; padding: 20px; }
    .section { display: none; }
    .section.active { display: block; }
    .card { background: #111; border: 1px solid #0f0; padding: 20px; margin: 10px 0; }
    input { background: #000; color: #0f0; border: 1px solid #0f0; padding: 8px; margin: 5px 0; width: 100%; }
    button { background: #0f0; color: #000; padding: 10px 20px; border: none; cursor: pointer; font-weight: bold; }
    button:hover { background: #0a0; }
    .stat { font-size: 2em; font-weight: bold; color: #0f0; }
    .log { background: #000; color: #0f0; padding: 10px; margin: 5px 0; max-height: 200px; overflow-y: auto; border: 1px solid #0f0; font-family: monospace; font-size: 0.8em; }
    .error { color: #f00; }
    .success { color: #0f0; }
  </style>
</head>
<body>
  <div id="app">
    <h1>🖥️  Dashboard Debug</h1>
    
    <!-- FORM SECTION -->
    <div id="form" class="section active card">
      <h2>Formulario</h2>
      <label>URL:
        <input type="text" id="url" value="https://umane.emeal.nttdata.com/git/COITDEVSOCOEAPPSIA/crewai-nativeai">
      </label>
      <label>Token:
        <input type="password" id="token" value="sebwvkV21gB-gpK12j1y">
      </label>
      <label>Project Path:
        <input type="text" id="project" value="COITDEVSOCOEAPPSIA/crewai-nativeai">
      </label>
      <button onclick="submit()">Iniciar Análisis</button>
    </div>
    
    <!-- DASHBOARD -->
    <div id="dashboard" class="section card">
      <h2>Resultados</h2>
      <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-bottom: 20px;">
        <div>
          <div>Total</div>
          <div class="stat" id="total">0</div>
        </div>
        <div>
          <div>Abiertos</div>
          <div class="stat" id="opened">0</div>
        </div>
        <div>
          <div>Cerrados</div>
          <div class="stat" id="closed">0</div>
        </div>
      </div>
      <button onclick="showForm()">Volver</button>
    </div>
    
    <!-- LOGS -->
    <div class="card">
      <h2>Logs del Cliente</h2>
      <div id="logs" class="log"></div>
    </div>
  </div>

  <script>
    const logs = [];
    const API_BASE = "http://localhost:8006";
    
    function log(msg, isError = false) {
      const time = new Date().toLocaleTimeString();
      const fullMsg = `[${time}] ${msg}`;
      logs.push({msg: fullMsg, error: isError});
      
      const logsDiv = document.getElementById("logs");
      logsDiv.innerHTML = logs.map(l => `<div class="${l.error ? 'error' : 'success'}">${l.msg}</div>`).join("");
      logsDiv.scrollTop = logsDiv.scrollHeight;
      
      console.log(msg);
    }
    
    function showSection(id) {
      document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
      document.getElementById(id).classList.add("active");
    }
    
    function showForm() {
      showSection("form");
    }
    
    async function submit() {
      try {
        log("📤 Iniciando análisis...");
        
        const config = {
          repository_url: document.getElementById("url").value,
          token: document.getElementById("token").value,
          project_path: document.getElementById("project").value,
          ticket_states: ["opened", "closed"],
          min_tickets: 5
        };
        
        log(`📍 URL: ${config.repository_url}`);
        
        // POST
        log("📤 POST /api/v1/analyze");
        const postResp = await fetch(`${API_BASE}/api/v1/analyze`, {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({config})
        });
        
        if (!postResp.ok) {
          log(`❌ POST failed: ${postResp.status}`, true);
          return;
        }
        
        const postData = await postResp.json();
        const jobId = postData.job_id;
        log(`✅ Job creado: ${jobId}`);
        log(`📊 Status inicial: ${postData.status}`);
        
        showSection("dashboard");
        
        // Polling
        let attempts = 0;
        while (attempts < 20) {
          attempts++;
          await new Promise(r => setTimeout(r, 1000));
          
          log(`🔄 Polling attempt ${attempts}...`);
          const pollResp = await fetch(`${API_BASE}/api/v1/jobs/${jobId}`);
          
          if (!pollResp.ok) {
            log(`❌ Poll failed: ${pollResp.status}`, true);
            return;
          }
          
          const pollData = await pollResp.json();
          log(`   Status: ${pollData.status} | Progress: ${pollData.progress}%`);
          
          if (pollData.status === "completed") {
            log(`✅ Análisis completado`);
            
            if (pollData.data) {
              log(`📊 Data recibido:`);
              log(`   total=${pollData.data.total}, opened=${pollData.data.opened}, closed=${pollData.data.closed}`);
              
              // UPDATE DOM
              document.getElementById("total").textContent = pollData.data.total;
              document.getElementById("opened").textContent = pollData.data.opened;
              document.getElementById("closed").textContent = pollData.data.closed;
              
              log(`✏️ DOM actualizado`);
            } else {
              log(`❌ No data en respuesta`, true);
            }
            return;
          } else if (pollData.status === "failed") {
            log(`❌ Análisis falló: ${pollData.message}`, true);
            return;
          }
        }
        
        log(`❌ Máximo de intentos alcanzado`, true);
        
      } catch (e) {
        log(`❌ Error: ${e.message}`, true);
      }
    }
    
    log("✅ Cliente listo. Completa el formulario y haz clic en 'Iniciar Análisis'");
  </script>
</body>
</html>
